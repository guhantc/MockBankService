# Configuration for Persistent H2 Database
# Replace the existing application.yml files with these configurations for persistent storage

# Customer Service (customer-service/src/main/resources/application.yml)
---
server:
  port: 8081

spring:
  application:
    name: customer-service
  datasource:
    url: jdbc:h2:file:./data/customerdb;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: hdfc@2024
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update  # Changed from create-drop to update for persistence
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

