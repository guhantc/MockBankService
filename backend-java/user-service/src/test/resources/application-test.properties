# Test Configuration for User Service

# Database Configuration (H2 in-memory for testing)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging Configuration
logging.level.com.hdfc.bank=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# JWT Configuration
jwt.secret=test-secret-key-for-jwt-token-generation-and-validation
jwt.expiration=86400000

# Security Configuration
spring.security.user.name=admin
spring.security.user.password=admin123

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Test specific configurations
spring.test.database.replace=none
spring.jpa.defer-datasource-initialization=true

# Disable Eureka for tests
eureka.client.enabled=false

# Redis Configuration (disabled for unit tests)
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.timeout=2000ms

# Test Data Configuration
test.data.users.create=true
test.data.users.count=5