version: '3.8'

services:
  # Oracle Database
  oracle-db:
    image: container-registry.oracle.com/database/express:21.3.0-xe
    container_name: hdfc-oracle-db
    environment:
      - ORACLE_PWD=hdfcbank123
      - ORACLE_CHARACTERSET=AL32UTF8
    ports:
      - "1521:1521"
      - "5500:5500"
    volumes:
      - oracle_data:/opt/oracle/oradata
      - ./oracle-init:/docker-entrypoint-initdb.d
    networks:
      - hdfc-network
    healthcheck:
      test: ["CMD", "sqlplus", "-s", "sys/hdfcbank123@localhost:1521/XE as sysdba", "@/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Redis for caching and session management
  redis:
    image: redis:7.2-alpine
    container_name: hdfc-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - hdfc-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Eureka Server
  eureka-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.eureka-server
    container_name: hdfc-eureka-server
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_PASSWORD=hdfcbank123
    networks:
      - hdfc-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # API Gateway
  api-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api-gateway
    container_name: hdfc-api-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://admin:hdfcbank123@eureka-server:8761/eureka
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - hdfc-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # User Service
  user-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.user-service
    container_name: hdfc-user-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://admin:hdfcbank123@eureka-server:8761/eureka
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@oracle-db:1521:XE
      - SPRING_DATASOURCE_USERNAME=hdfc_user
      - SPRING_DATASOURCE_PASSWORD=hdfcbank123
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
    depends_on:
      eureka-server:
        condition: service_healthy
      oracle-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hdfc-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # SAGA Orchestrator
  saga-orchestrator:
    build:
      context: ..
      dockerfile: docker/Dockerfile.saga-orchestrator
    container_name: hdfc-saga-orchestrator
    ports:
      - "8090:8090"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://admin:hdfcbank123@eureka-server:8761/eureka
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@oracle-db:1521:XE
      - SPRING_DATASOURCE_USERNAME=hdfc_saga
      - SPRING_DATASOURCE_PASSWORD=hdfcbank123
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
    depends_on:
      eureka-server:
        condition: service_healthy
      oracle-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hdfc-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

volumes:
  oracle_data:
    driver: local
  redis_data:
    driver: local

networks:
  hdfc-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16