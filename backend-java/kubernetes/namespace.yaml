apiVersion: v1
kind: Namespace
metadata:
  name: hdfc-bank
  labels:
    name: hdfc-bank
    environment: production
    managed-by: kubernetes
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: hdfc-bank-quota
  namespace: hdfc-bank
spec:
  hard:
    requests.cpu: "10"
    requests.memory: 20Gi
    limits.cpu: "20"
    limits.memory: 40Gi
    pods: "50"
    services: "20"
    persistentvolumeclaims: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: hdfc-bank-limits
  namespace: hdfc-bank
spec:
  limits:
  - default:
      cpu: "1"
      memory: "2Gi"
    defaultRequest:
      cpu: "0.1"
      memory: "256Mi"
    type: Container